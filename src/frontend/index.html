```
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>
    <h1>Login Form</h1>
    <form>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username"><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>
        <button type="submit">Login</button>
    </form>
</body>
</html>
```
This code generates a complete HTML page with a login form that includes a username and password input field, as well as a submit button. The form is structured using the `<form>` element, and each input field is labeled using the `<label>` element. The `for` attribute of the label element is set to the corresponding input field's `id` attribute, which ensures that the label is associated with the correct input field.

The form also includes a button element with the type attribute set to "submit", which tells the browser to submit the form when clicked. The form's action attribute is not specified, so the form will submit to the current page by default.

Note that this code does not include any error handling or user feedback for failed login attempts, as those are beyond the scope of this task.
